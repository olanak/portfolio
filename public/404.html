<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    var p = window.location.pathname;
    var stripped = p.replace(/^\/portfolio(?=\/|$)/, '') || '/';
    sessionStorage.setItem('redirect', stripped + window.location.search);
    window.location.replace(p.indexOf('/portfolio/') === 0 ? '/portfolio/' : '/');
  </script>
</head>
<body></body>
</html>
